    ['Deploy time',          x=>x.deploy,            true,  v=>v+' s'],
    ['Vertical recoil',      x=>x.recoil&&x.recoil.v,true,  v=>String(v)],
    ['Recoil direction',     x=>x.recoil&&x.recoil.dir,true,v=>v+'°'],
    ['Recoil variation',     x=>x.recoil&&x.recoil.var,true,v=>v+'°'],
    ['Recoil growth in ADS', x=>x.recoil&&x.recoil.incAds,true,v=>String(v)],
    ['ADS spread · standing',x=>x.adsStand,          true,  v=>v+'°'],
    ['ADS spread · moving',  x=>x.adsMove,           true,  v=>v+'°'],
    ['Hip spread · standing',x=>x.hipStand,          true,  v=>v+'°'],
    ['Hip spread · moving',  x=>x.hipMove,           true,  v=>v+'°'],
  ];
  const statRows = BSTATS.map(([label,get,lb,fmt])=>{
    const val = get(w);
    if(typeof val!=='number' || !isFinite(val)) return '';
    return prow(label, val, fmt, rankOf(get, val, lb));
  }).join('');

  const spreadMax = Math.max(0.5, ...WEAPONS.map(x=>Math.max(x.adsStand||0, x.adsMove||0, x.hipStand||0, x.hipMove||0)));
  const tight = v => Math.max(0.08, 1 - Math.min(1, (v||0)/spreadMax));
  const spreadAxes = [
    {label:'ADS-S', name:'ADS · standing', text:w.adsStand+'°', v:tight(w.adsStand), c:'#4fd1c5'},
    {label:'ADS-M', name:'ADS · moving',   text:w.adsMove+'°',  v:tight(w.adsMove),  c:'#54a0ff'},
    {label:'HIP-M', name:'Hip · moving',   text:w.hipMove+'°',  v:tight(w.hipMove),  c:'#ff5a5f'},
    {label:'HIP-S', name:'Hip · standing', text:w.hipStand+'°', v:tight(w.hipStand), c:'#ffb020'},
  ];

  // ---- range: radar + bracket ranks ----
  const rangeAxes = BUCKETS.map(b=>({
    label:b.toUpperCase(),
    name:{cqb:'Close quarters',mid:'Mid range',long:'Long range'}[b],
    text:e[b]+'th pct', v:e[b]/100, c:{cqb:'#ff5a5f',mid:'#ffb020',long:'#4fd1c5'}[b]
  }));

  // ---- damage: tiles + hits-to-kill ladder ----
  const muzzleDmg = shellDmg(w,0), farDmg = shellDmg(w, w.pts[w.pts.length-1][0]);
  const damMaxD = Math.max(...w.pts.map(p=>p[0]));
  let oneShotMax = -1, twoShotMax = -1;
  for(let x=0;x<=damMaxD;x++){ const b = btk(w,x); if(b<=1) oneShotMax = x; if(b<=2) twoShotMax = x; }
  const dmgTiles = [
    {k:'Muzzle damage',   num:muzzleDmg, dec:1, hot:true},
    {k:'At '+damMaxD+' m',num:farDmg, dec:1},
    {k:'Damage kept',     num:Math.round(100*farDmg/Math.max(0.1,muzzleDmg)), suf:'%'},
    {k:'1-shot range',    text:oneShotMax>=0 ? '≤ '+oneShotMax+' m' : '—', hot:oneShotMax>=0},
    {k:'2-hit range',     text:twoShotMax>=0 ? '≤ '+twoShotMax+' m' : '—'},
    {k:'First falloff at',text:w.pts.length>1 ? w.pts[1][0]+' m' : '—'},
  ];
  const dmgTilesHTML = dmgTiles.map((t,i)=>{
    const val = t.text!=null ? esc(t.text)
      : `${t.pre||''}<span${t.dec?` data-dec="${t.dec}"`:''} data-count="${t.num}">0</span>${t.suf||''}`;
    return `<div class="ktile ${t.hot?'hot':''}" style="--i:${i*70}ms"><span class="k">${t.k}</span><span class="v">${val}</span></div>`;
  }).join('');
  const bc = btkCurve(w);

  // ---- cadence: shot-to-shot and reload timing ----
  const cycle = CYCLE_MS(w);
  const rl = w.rl || {};
  const fullReload = rl.empty!=null ? rl.empty : null;
  const magDump = (w.mag-1)*cycle;
  const loopSec = w.deploy + magDump/1000 + (fullReload||0);
  const sustRpm = fullReload ? Math.round(w.mag/(magDump/1000 + fullReload)*60) : null;
  const CSTATS = [
    ['Shot → shot',         x=>CYCLE_MS(x), true, v=>Math.round(v)+' ms'],
    ['Magazine dump',       x=>(x.mag-1)*CYCLE_MS(x), true, v=>Math.round(v)+' ms'],
    ['Reload · from empty', x=>(x.rl && x.rl.empty!=null) ? x.rl.empty*1000 : null, true, v=>r1(v/1000)+' s'],
    ['Reload · tactical',   x=>(x.rl && !x.rl.perShell && x.rl.tac!=null) ? x.rl.tac*1000 : null, true, v=>r1(v/1000)+' s'],
    ['Raise / deploy',      x=>x.deploy*1000, true, v=>r1(v/1000)+' s'],
    ['Holster',             x=>x.undeploy*1000, true, v=>r1(v/1000)+' s'],
    ['Full loop',           x=>x.deploy*1000 + (x.mag-1)*CYCLE_MS(x) + ((x.rl && x.rl.empty!=null) ? x.rl.empty*1000 : 0), true, v=>r1(v/1000)+' s'],
  ];
  const cadRows = CSTATS.map(([label,get,lb,fmt])=>{
    const val = get(w);
    if(typeof val!=='number' || !isFinite(val)) return '';
    return prow(label, val, fmt, rankOf(get, val, lb));
  }).join('');
  const medOf = a => { a = a.slice().sort((x,y)=>x-y); return a[Math.floor(a.length/2)]; };
  const cycAll = WEAPONS.map(x=>CYCLE_MS(x));
  const cycCls = WEAPONS.filter(x=>x.cls===w.cls).map(x=>CYCLE_MS(x));
  const cadBars = [['This weapon', cycle, 1], [w.clsLabel+' median', medOf(cycCls), 0],
                   ['Arsenal median', medOf(cycAll), 0], ['Fastest in the game', Math.min(...cycAll), 0]];
  const cadMax = Math.max(1, ...cadBars.map(b=>b[1]));
  const cadRace = cadBars.map(([n,t,me])=>`<div class="krow ${me?'me':''}">
      <span class="n">${esc(n)}</span>
      <span class="b"><i data-w="${Math.max(4, Math.round(100 - t/cadMax*86))}"></i></span>
      <span class="v">${t<40?'instant':Math.round(t)+'<small>ms</small>'}</span></div>`).join('');
  const autoMode = (w.modes||[]).includes('auto');
  const mechNote = w.mech==='bolt'
    ? `<b>Bolt action.</b> The action locks the gun for the full ${Math.round(cycle)} ms between shots — a miss costs an entire cycle, and there is no follow-up until the bolt is worked again.`
    : w.mech==='pump'
    ? `<b>Pump action.</b> You cycle between every shell${rl.perShell?`, and the tube loads one at a time (+${r1(rl.tac)} s each)`:''}. The game files publish no pump cycle time, so the catalog uses its standing ${Math.round(cycle)} ms estimate — verify it on the range.`
    : autoMode
    ? `<b>Automatic.</b> ${Math.round(cycle)} ms between rounds is the ceiling while the magazine lasts; after that the ${fullReload!=null?r1(fullReload)+' s':''} reload is what actually costs you the fight.`
    : `<b>Semi-automatic.</b> One trigger pull per shot — ${Math.round(cycle)} ms is the trigger reset, so your own sight picture sets the real pace.`;
  const cadTiles = [
    {k:'Shot → shot', num:Math.round(cycle), suf:'ms', hot:true},
    {k:'Shots / second', num:+(1000/cycle).toFixed(2), dec:2},
    {k:'Magazine dump', num:+(magDump/1000).toFixed(2), dec:2, suf:'s'},
    {k:'Reload from empty', text: fullReload!=null ? (fullReload>=10 ? Math.round(fullReload) : r1(fullReload)) + ' s' + (rl.est?'*':'') : '—', hot:fullReload!=null},
    {k:'Full loop', num:+loopSec.toFixed(2), dec:2, suf:'s', hot:true},
    {k:'Sustained', text: sustRpm!=null ? sustRpm+' rpm' : '—'},
  ];
  const cadTilesHTML = cadTiles.map((t,i)=>{
    const val = t.text!=null ? esc(t.text)
      : `${t.pre||''}<span${t.dec?` data-dec="${t.dec}"`:''} data-count="${t.num}">0</span>${t.suf||''}`;
    return `<div class="ktile ${t.hot?'hot':''}" style="--i:${i*70}ms"><span class="k">${t.k}</span><span class="v">${val}</span></div>`;
  }).join('');

  document.getElementById('sections').innerHTML = `
    <section class="pane" id="overview">
      <h3 class="sh">Kill profile</h3>
      ${killDash(w, d)}
      <h3 class="sh" style="margin-top:28px">Details</h3>
      ${w.desc?`<p class="desc">${esc(w.desc)}</p>`:''}
      <div class="panels">
        <div class="panel"><h4>At ${d} m — current range</h4>
          <table class="spec">
            <tr><td>Bullets to kill</td><td>${btk(w,d)}</td></tr>
            <tr><td>Time to kill</td><td>${btk(w,d)<=1?'instant (1 shot)':Math.round(ttk(w,d))+' ms'}</td></tr>
            <tr><td>Damage per hit</td><td>${r1(shellDmg(w,d))}</td></tr>
            <tr><td>DPS</td><td>${Math.round(dps(w,d))}</td></tr>
            <tr><td>Range bracket</td><td>${d<=RANGES.cqb?'close quarters':d<=RANGES.mid?'mid range':'long range'}</td></tr>
          </table>
          <div class="note">Adjust the Range control to re-evaluate every number on this page.</div>
        </div>
        <div class="panel"><h4>Handling</h4><div class="gauges">
          ${gauge('Fire rate', rpmOf(w), gaugeMax.rof, rpmOf(w)+' RPM', '')}
          ${gauge('Muzzle velocity', w.velocity, gaugeMax.vel, w.velocity+' m/s', 'c2')}
          ${gauge('Magazine', w.mag, gaugeMax.mag, w.mag+' rds', 'c3')}
        </div></div>
        <div class="panel"><h4>Fire modes & loadout</h4><div class="modes">${
          (w.modes||[]).map(m=>{const f=w.modeData&&w.modeData[m];
            return `<span class="mode">${({auto:'Auto',single:'Single',burst:'Burst'})[m]||m}${f?` <b>${Math.round(f)}</b>`:''}</span>`}).join('') || '—'
        }</div>
        <table class="spec" style="margin-top:12px">
          <tr><td>Caliber</td><td>${esc(w.ammo)}</td></tr>
          ${w.pellets>1?`<tr><td>Pellets per shell</td><td>${w.pellets}</td></tr>`:''}
          <tr><td>Attachment slots</td><td>${Object.keys(w.atts||{}).length}</td></tr>
          <tr><td>Attachments</td><td>${attTotal}</td></tr>
          <tr><td>Meta tier</td><td>${ti?`<span class="pill tierpill ${ti.t}">TIER ${ti.t}</span>`:'—'}</td></tr>
        </table>
        </div>
        <div class="panel"><h4>Ballistics at a glance</h4><table class="spec">${quickRows}</table></div>
      </div>
    </section>

    <section class="pane" id="ballistics">
      <h3 class="sh">Ballistics & handling</h3>
      <p class="lede">Every bar below is this weapon ranked against all ${WEAPONS.length} guns — a full bar means it is currently the best in the arsenal at that metric, and the number on the right is its rank.</p>
      <div class="panels">
        <div class="panel"><h4>Versus the arsenal</h4>${statRows || '<div class="none">No data.</div>'}</div>
        <div class="panel"><h4>Spread cone — further out is tighter</h4>
          ${radar(spreadAxes)}
          <div class="note">Standalone cone half-angle in degrees at the muzzle. The shaded polygon is scaled against the widest weapon in the game (${r1(spreadMax)}°), not against this gun's own numbers.</div>
        </div>
      </div>
      <div class="panels" style="margin-top:16px">
        <div class="panel"><h4>Recoil vector</h4>${recoilVector(w)}
          <div class="note">Arrow length is the datamined vertical magnitude; its angle is the lateral bias; the red wedge is the shot-to-shot variation. A short arrow inside a wide wedge means the pattern walks around unpredictably.</div>
        </div>
        <div class="panel"><h4>Weapon data</h4><table class="spec">${specRows}</table></div>
      </div>
      <div class="panel" style="margin-top:16px"><h4>Damage by range band</h4>${dmgRows}
        <div class="note">${w.pellets>1?`Per-shell total (${w.pellets} pellets × ${r1(dmgAt(w,0))}).`:'Damage per bullet'} · constant inside each band · 100 HP chest.</div>
      </div>
    </section>

    <section class="pane" id="range">
      <h3 class="sh">Range profile</h3>
      <p class="lede">How this weapon ranks against all ${WEAPONS.length} weapons in each engagement bracket, measured by kill time at the bracket's representative distance.</p>
      <div class="panels">
        <div class="panel"><h4>Bracket percentiles</h4>${radar(rangeAxes)}
          <div class="note">100 = fastest killing weapon of the arsenal in that bracket, 0 = slowest. The triangle is scaled in absolute percentile, so a weapon that is only good up close points hard to one corner.</div>
        </div>
        <div class="panel"><h4>Where it lands</h4>
          ${BUCKETS.map(b=>{
            const dd = RANGES[b], kt = killTime(w,dd,b), rk = rankOf(x=>killTime(x,dd,b), kt, true);
            return `<div class="prow"><span class="n">${{cqb:'Close quarters',mid:'Mid range',long:'Long range'}[b]} · ${dd} m</span>
              <span class="b"><i class="${toneOf(e[b])}" data-w="${Math.max(3,e[b])}"></i></span>
              <span class="v">${Math.round(ttk(w,dd))}<small>ms</small></span>
              <span class="r">#${rk.rank}<small>/${rk.n}</small></span></div>`;
          }).join('')}
          <div class="note">Times are first-kill TTK at the bracket distance; ranks use the weighted kill-time model that also charges the weapon's own cycle time, which is why they can differ slightly from raw TTK.</div>
        </div>
      </div>
      <div class="panel" style="margin-top:16px"><h4>Arsenal landscape</h4>${scatterRange(w)}</div>
    </section>

    <section class="pane" id="damage">
      <h3 class="sh">Damage & falloff</h3>
      <p class="lede">Chest damage and hits-to-kill across distance. Dashed lines mark the three engagement brackets used for map recommendations.</p>
      <div class="ktiles">${dmgTilesHTML}</div>
      <div class="kgrid2" style="margin-top:14px">
        <div class="kpanel"><h4>Chest damage by distance</h4>
          <div class="kcurvewrap">${damageChart(w)}</div>
          <div class="lgd"><span><i></i>damage per ${w.pellets>1?'shell':'bullet'}</span><span style="color:#4fd1c5">┆ bracket reference distance</span></div>
        </div>
        <div class="kpanel"><h4>Hits to kill by distance</h4>
          <div class="kcurvewrap">${bc.svg}${bc.dots}
            <span class="ky" style="top:1px">1 hit</span>
            <span class="ky" style="bottom:1px">${bc.maxB} hits</span></div>
          <div class="kxaxis">${[...new Set([0, RANGES.cqb, RANGES.mid, RANGES.long, bc.maxD].filter(v=>v<=bc.maxD))].map(v=>{
            const pct = v/bc.maxD*100;
            return `<span style="left:${pct.toFixed(2)}%;transform:translateX(${v===0?'0':v===bc.maxD?'-100%':'-50%'})">${v} m</span>`;
          }).join('')}</div>
          <div class="note">Steps are the game's real damage bands — damage is constant inside each band, so the ladder only moves where the game changes the multiplier.</div>
        </div>
      </div>
      <div class="panel" style="margin-top:14px"><h4>Band by band</h4>${dmgRows}
        <div class="note">${w.pellets>1?`Per-shell total (${w.pellets} pellets × ${r1(dmgAt(w,0))}).`:'Damage per bullet'} · 100 HP chest · no headshot or limb multiplier in the model.</div>
      </div>
    </section>

    <section class="pane" id="cadence">
      <h3 class="sh">Cadence</h3>
      <p class="lede">How fast the gun comes back for the next shot, and how long it sits out while reloading. These are the numbers that decide the <b>second</b> engagement, not the first.</p>
      <div class="kpanel" style="margin-bottom:16px">
        <h4>Sprint → empty magazine → reloaded, to scale</h4>
        ${cadenceStrip(w, cycle, fullReload)}
        <div class="note">Bar widths are real time, drawn from the game's own deploy, fire-rate and reload fields. Hover a segment for its duration.</div>
      </div>
      <div class="kgrid2">
        <div class="kpanel"><h4>Cadence vs the arsenal</h4>${cadRows || '<div class="none">No timing data.</div>'}</div>
        <div class="kpanel"><h4>Shot-to-shot race</h4><div class="krace">${cadRace}</div>
          <div class="note">${mechNote}</div>
        </div>
      </div>
      <div class="ktiles" style="margin-top:14px">${cadTilesHTML}</div>
      ${rl.perShell?`<div class="avoid" style="border-color:#3d4a2e"><b>Shell-fed.</b> The magazine loads one shell at a time — ${r1(rl.tac)} s each. Filling a ${w.mag}-shell tube from empty costs ${r1(fullReload)} s${rl.est?', derived from the game’s per-shell animation timings (pre-delay + first shell + each shell + post-delay)':''}. A tactical top-up is only worth it when you have a moment.</div>`:''}
      ${rl.est && !rl.perShell?`<div class="note">* reload time reconstructed from the game's reload component timings.</div>`:''}
    </section>

    <section class="pane" id="attachments">
      <h3 class="sh">Attachments</h3>
      <p class="lede">${attTotal} attachments across ${Object.keys(w.atts||{}).length} slots. Every card is tagged with what its own in-game text says it does. Pick a slot, or filter the whole gun by the improvement you are chasing.</p>
      <div class="attbar" id="attbar"></div>
      <div class="gchips" id="attgoals"></div>
      <input id="attq" class="attq" type="search" placeholder="Filter by name…" autocomplete="off">
      <div class="attgrid" id="attgrid"></div>
    </section>

    <section class="pane" id="maps">
      <h3 class="sh">Recommended maps</h3>
      <p class="lede">Each map is scored by how well its documented engagement mix matches this weapon's kill speed in the three brackets. The number shown is the <b>advantage over an evenly mixed map</b>, in percentile points — so a flexible weapon sits near 0 everywhere, while a specialist swings hard between maps.</p>
      ${MAPS.length ? `<div class="mapsum">
        <div class="msum"><span class="k">Best</span><span class="v" style="color:#6fd48a">${esc(best.map.name)} <b>${best.delta>0?'+':''}${best.delta}</b></span></div>
        <div class="msum"><span class="k">Weakest</span><span class="v" style="color:#e0707a">${esc(worst.map.name)} <b>${worst.delta>0?'+':''}${worst.delta}</b></span></div>
        <div class="msum"><span class="k">Spread</span><span class="v">${best.delta>0?'':''}${spread} pts</span></div>
        <div class="msum"><span class="k">Profile</span><span class="v">${esc(weaponTagline(w))}</span></div>
      </div>` : '<div class="none">Map data unavailable.</div>'}
      <div class="kpanel" style="margin-bottom:18px">
        <h4>Advantage over an evenly mixed map — every map</h4>
        <div class="krace">${MAPS.length ? mapDeltaChart(w) : '<div class="none">No map data.</div>'}</div>
        <div class="note">Bars right of centre are maps that favour this weapon, left of centre are maps that work against it. Values are percentile points of kill speed relative to a hypothetical map with an even CQB / mid / long split.</div>
      </div>
      <div class="mapwrap">${mapCards}</div>
      ${MAPS.length && worst.delta < -2 ? `<div class="avoid"><b>Worst fit:</b> ${esc(worst.map.name)} (${worst.delta>0?'+':''}${worst.delta}) — its engagement mix plays away from this weapon's strengths.</div>`
        : (MAPS.length ? `<div class="avoid"><b>Uniform performer:</b> every map lands within ${spread} points, so map choice barely changes how this weapon plays.</div>` : '')}
      ${(MAPS.length && Math.max(e.cqb,e.mid,e.long) < 25) ? `<div class="avoid" style="border-color:#4a2b2e"><b>Below average everywhere:</b> this weapon ranks in the bottom quarter of the arsenal in all three brackets, so no map is a clear advantage — it needs positioning and attachments to compensate.</div>` : ''}
      <div class="note">Map engagement mix is sourced from EA developer map guides and public map breakdowns. Fit is a comparison aid, not a verdict: player skill, positioning and loadout still dominate.</div>
    </section>

    <section class="pane" id="meta">
      <h3 class="sh">Meta & real world</h3>
      <div class="panels">
        <div class="panel"><h4>Tier distribution — ${esc(SEASON)}</h4>
          ${tierLadder(ti)}
          <div class="note">${ti?`This weapon sits in <b>tier ${ti.t}</b>.`:'This weapon has no published tier.'} Column heights are how many of the ${Object.keys(TIER).length} tiered weapons land in each band.</div>
        </div>
        <div class="panel"><h4>Meta reading</h4>
          ${ti?`<div class="rw"><span class="pill tierpill ${ti.t}">TIER ${ti.t}</span><div style="margin-top:9px">${esc(ti.n)}</div>
            <div class="kv" style="margin-top:8px">Source: <a href="${ti.s}" target="_blank" rel="noopener">${esc(ti.s.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a></div></div>`
            :'<div class="rw">No tier data for this weapon.</div>'}
        </div>
      </div>
      <div class="panels" style="margin-top:16px">
        <div class="panel"><h4>Real-world reference</h4>
          ${rw.realName?`<div class="rw"><div class="rvb">${esc(rw.realName)}</div>
            <div class="modes" style="margin-top:10px">${[rw.manufacturer?'<span class="mode">'+esc(rw.manufacturer)+'</span>':'', rw.country?'<span class="mode">'+esc(rw.country)+'</span>':'', rw.year?'<span class="mode"><b>'+esc(rw.year)+'</b></span>':'', rw.realCaliber?'<span class="mode">'+esc(rw.realCaliber)+'</span>':''].filter(Boolean).join('')}</div>
            <div class="kv" style="margin-top:8px">${esc(rw.type||'')}</div>
            ${rw.source?`<div class="kv" style="margin-top:8px">Source: <a href="${rw.source}" target="_blank" rel="noopener">${esc(rw.source.replace(/^https?:\/\//,'').split('/')[0])}</a></div>`:''}
          </div>`:'<div class="rw">No reliable real-world mapping found.</div>'}
        </div>
        <div class="panel"><h4>In-game identity</h4>
          <table class="spec">
            <tr><td>Class</td><td>${esc(w.clsLabel)}</td></tr>
            <tr><td>Caliber</td><td>${esc(w.ammo)}</td></tr>
            <tr><td>Fire modes</td><td>${(w.modes||[]).map(m=>({auto:'Auto',single:'Single',burst:'Burst'})[m]||m).join(' / ')||'—'}</td></tr>
            <tr><td>Pellets per shell</td><td>${w.pellets}</td></tr>
            <tr><td>Attachment slots</td><td>${Object.keys(w.atts||{}).length}</td></tr>
            <tr><td>Attachments</td><td>${attTotal}</td></tr>
          </table>
        </div>
        <div class="panel" style="grid-column:1/-1"><h4>Sources & method</h4><div class="note" id="msrc"></div></div>
      </div>
    </section>`;

  const msrc = document.getElementById('msrc');
  if(msrc) msrc.innerHTML = document.getElementById('foot').innerHTML;
  const aq = document.getElementById('attq');
  if(aq){ aq.value = paneState.attq; aq.oninput = ()=>{ paneState.attq = aq.value; renderAttBody(w); }; }
  renderAttBody(w);
  showPane(paneState.pane, keepScroll);
}

/* tabs: only the active pane is in the layout, so switching is instant and never scrolls */
function showPane(id, keepScroll){
  if(!document.getElementById(id)) id = SECTIONS[0][0];
  paneState.pane = id;
  document.querySelectorAll('#sections > section.pane').forEach(s=>s.classList.toggle('on', s.id===id));
  document.querySelectorAll('#subnav a').forEach(a=>a.classList.toggle('on', a.dataset.s===id));
  playAnim(document.getElementById(id), !keepScroll);
  if(!keepScroll) window.scrollTo(0,0);
}

/* attachments: a slot at a time, or every slot filtered by the improvement you want */
function renderAttBody(w){
  const slots = Object.entries((w&&w.atts)||{});
  const bar = document.getElementById('attbar'), grid = document.getElementById('attgrid'), goals = document.getElementById('attgoals');
  if(!bar || !grid) return;
  if(!slots.length){ bar.innerHTML = ''; if(goals) goals.innerHTML = ''; grid.innerHTML = '<div class="none">No attachment data.</div>'; return; }
  if(!slots.some(([s])=>s===paneState.att)) paneState.att = slots[0][0];

  // which improvements this weapon can actually buy — never offer a filter that returns nothing
  const avail = {};
  for(const [slot, items] of slots) for(const it of items){
    const eff = attEffects(slot, it[2]);
    if(eff) for(const [id] of AXES) if(eff[id]===1) avail[id] = (avail[id]||0)+1;
  }
  const goal = paneState.attGoal && avail[paneState.attGoal] ? paneState.attGoal : null;
  paneState.attGoal = goal;

  bar.innerHTML = slots.map(([slot,items])=>
    `<button class="attslot ${(!goal && slot===paneState.att) ?'on':''}" data-slot="${slot}">`+
      `${GLYPH[slot]?`<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPH[slot]}</svg>`:''}`+
      `<span>${slot}</span><span class="n">${items.length}</span></button>`).join('');
  bar.querySelectorAll('.attslot').forEach(b=>b.onclick=()=>{ paneState.att = b.dataset.slot; paneState.attGoal = null; renderAttBody(curW); });

  if(goals){
    goals.innerHTML = AXES.filter(([id])=>avail[id]).map(([id,label])=>
        `<button class="gchip ${goal===id?'on':''}" data-goal="${id}">${label}<span style="opacity:.6;margin-left:6px">${avail[id]}</span></button>`).join('')
      + (goal ? `<button class="gchip" data-goal="">✕ all slots</button>` : '');
    goals.querySelectorAll('.gchip').forEach(b=>b.onclick=()=>{ paneState.attGoal = b.dataset.goal || null; renderAttBody(curW); });
  }

  const q = paneState.attq.trim().toLowerCase();
  let list;
  if(goal){
    list = [];
    for(const [slot, items] of slots) for(const it of items){
      const eff = attEffects(slot, it[2]);
      if(eff && eff[goal]===1) list.push({slot, it});
    }
    list.sort((a,b)=> b.it[1]-a.it[1]);
  } else {
    list = ((slots.find(([s])=>s===paneState.att)||[,[]])[1]).map(it=>({slot:paneState.att, it}));
  }
  if(q) list = list.filter(x=>String(x.it[0]).toLowerCase().includes(q));

  grid.innerHTML = list.length ? list.map(({slot,it})=>{
    const [n, pt, tipIdx, ic] = it;
    return `<div class="attcard">${attIcon(slot,ic)}<div class="txt">
      <div class="n">${esc(n)}${pt?`<em>${pt} pt</em>`:''}${goal?`<span class="slot">${esc(slot)}</span>`:''}</div>
      ${tipIdx>=0?`<div class="td">${esc(TIPS[tipIdx])}</div>`:''}
      ${efxPills(attEffects(slot, tipIdx))}</div></div>`;
  }).join('') : '<div class="none">No matching attachments.</div>';
}

/* ================= playground: gunsmith sandbox =================
   Effects are read straight from the datamined attachment fields, already resolved for this
   weapon (weaponOverrides / frostyModifiers / adsTimeTierModByWeapon, folded in by the build
   script). Two units are preserved: absolute fields keep their real magnitude (velocity ×1.25,
   minimap spotting ×0.14) and tier fields are the in-game UI ladder. The direction of every
   field is the one its own panel text uses — recoil, ADS-time and moving-spread tiers are
   higher-is-better; hip-spread and the *TierShift family (deploy, sprint recovery, ADS move
   speed) are lower-is-better — so a positive lane index always means an improvement, and a
   negative one is the price paid for it. */
const PG_FX = {
  velMult:['velocity',1], velTierMod:['range',1],
  dv:['damage per shot',1], btk:['shots to kill',-1], coll:['penetration',1],
  magd:['magazine',1],
  adsRecoilTierMod:['ADS recoil',1], hipRecoilTierMod:['hip recoil',1],
  adsRecoilVariationTierMod:['ADS stability',1], hipRecoilVariationTierMod:['hip stability',1],
  adsRecoilDecayMult:['recovery',1],
  adsSpreadIncMult:['ADS spread',-1], movingAdsSpreadTierMod:['moving accuracy',1],
  weaponSwayMult:['sway',-1],
  adsTimeTierMod:['ADS time',1], adsTimeTierShift:['ADS time',-1],
  adsMoveSpeedTierShift:['ADS move speed',-1],
  sprintRecoveryTierShift:['sprint recovery',-1], deployTimeTierShift:['deploy',-1],
  reloadSpeedMult:['reload',1], reloadSpeedTier:['reload',1],
  hipSpreadTierMod:['hip spread',-1], hipSpreadIncMult:['hip spread',-1],
  worldSpotMult:['spotting',-1], minimapSpotMult:['minimap',-1],
  adsInc:['ADS spread (abs)',-1], hipInc:['hip spread (abs)',-1],
};
/* fields whose score is a signed delta, a ratio, or a value compared against the bare gun */
const PG_REF = new Set(['dv','btk','coll']);
const PG_MULT = new Set(['velMult','adsSpreadIncMult','hipSpreadIncMult','adsRecoilDecayMult',
                         'reloadSpeedMult','weaponSwayMult','worldSpotMult','minimapSpotMult']);
const PG_TIERK = new Set(['velTierMod','adsRecoilTierMod','hipRecoilTierMod','adsRecoilVariationTierMod',
  'hipRecoilVariationTierMod','hipSpreadTierMod','movingAdsSpreadTierMod','adsTimeTierMod',
  'adsTimeTierShift','adsMoveSpeedTierShift','sprintRecoveryTierShift','deployTimeTierShift','reloadSpeedTier']);
const PG_LANES = [
  {id:'range',    label:'Range',     f:[['velMult',1.0,'ratio'],['velTierMod',1.0,'delta']]},
  {id:'power',    label:'Power',     f:[['dv',1.0,'ref'],['btk',3.0,'ref'],['coll',0.6,'ref']]},
  {id:'recoil',   label:'Control',   f:[['adsRecoilTierMod',1.0,'delta'],['hipRecoilTierMod',0.6,'delta'],
                                        ['adsRecoilVariationTierMod',0.5,'delta'],['adsRecoilDecayMult',1.5,'ratio']]},
  {id:'accuracy', label:'Accuracy',  f:[['adsSpreadIncMult',1.5,'ratio'],['movingAdsSpreadTierMod',1.0,'delta'],
                                        ['weaponSwayMult',1.0,'ratio']]},
  {id:'handling', label:'Handling',  f:[['adsTimeTierMod',1.0,'delta'],['adsTimeTierShift',1.0,'delta'],
                                        ['adsMoveSpeedTierShift',0.7,'delta'],['sprintRecoveryTierShift',1.0,'delta'],
                                        ['deployTimeTierShift',1.0,'delta']]},
  {id:'reload',   label:'Reload',    f:[['reloadSpeedMult',2.0,'ratio'],['reloadSpeedTier',1.0,'delta']]},
  {id:'autonomy', label:'Capacity',  f:[['magd',0.15,'delta']]},
  {id:'hipfire',  label:'Hip-fire',  f:[['hipSpreadTierMod',1.0,'delta'],['hipSpreadIncMult',1.5,'ratio']]},
  {id:'stealth',  label:'Stealth',   f:[['worldSpotMult',1.0,'ratio'],['minimapSpotMult',1.0,'ratio']]},
];
const playState = {slug:null, sel:{}, slot:null, goal:'recoil'};

function pgCurveAt(pts, d){
  if(!pts || !pts.length) return 0;
  let v = pts[0][1];
  for(let i=0;i<pts.length;i++){ if(d >= pts[i][0]) v = pts[i][1]; else break; }
  return v;
}
function pgDmg(w, o){
  const b = w.play.base, fx = o.fx || {};
  return (fx.pel || b.pel || 1) * pgCurveAt(fx.dmg || b.dmg, state.dist);
}
function pgOpt(w, slot, id){ const s = w.play.slots.find(x=>x.k===slot); return s ? s.o.find(o=>o.id===id) : null; }
function pgBtk(dv){ return Math.max(1, Math.ceil(HEALTH/(dv+1e-9))); }
function pgVal(w, o, k){
  if(k==='dv') return pgDmg(w,o);
  if(k==='btk') return pgBtk(pgDmg(w,o));
  if(k==='coll') return (o.fx && o.fx.coll!=null) ? o.fx.coll : w.play.base.coll;
  if(k==='magd') return (o.fx||{}).magd || 0;
  return (o.fx||{})[k];
}
function pgBase(w, k){
  if(k==='dv') return pgDmg(w,{fx:{}});
  if(k==='btk') return pgBtk(pgDmg(w,{fx:{}}));
  if(k==='coll') return w.play.base.coll;
  return null;
}
function pgFScore(w, o, f){
  const [k, wt, kind] = f, dir = (PG_FX[k]||[k,1])[1];
  const v = pgVal(w, o, k);
  if(v == null) return 0;
  if(kind==='delta') return wt*dir*v;
  if(kind==='ratio') return wt*(dir>0 ? v-1 : 1-v);
  const b = pgBase(w, k);
  if(!b) return 0;
  return wt*dir*(v-b)/Math.abs(b);
}
function pgOptScore(w, o, lane){ let s=0; for(const f of lane.f) s += pgFScore(w,o,f); return s; }
/* the factory option of a slot, used to re-base every score to the gun as it ships */
function pgRef(w, slot){
  const s = w.play.slots.find(x=>x.k===slot);
  return s ? (s.o.find(o=>o.id===w.play.def[slot]) || null) : null;
}
/* a slot's contribution is measured against its factory part, so an axis reads exactly 0
   for the untouched weapon even when a factory part carries an absolute value such as a
   fully suppressed muzzle (spotting ×0). */
function pgSlotScore(w, slot, id, lane){
  const o = pgOpt(w, slot, id); if(!o) return 0;
  const ref = pgRef(w, slot);
  return pgOptScore(w, o, lane) - (ref ? pgOptScore(w, ref, lane) : 0);
}
function pgLane(w, sel, lane){
  let s=0;
  for(const sl of w.play.slots) s += pgSlotScore(w, sl.k, sel[sl.k], lane);
  return s;
}
/* per-option lane deltas, cached on the option (its slot id is stable) */
function pgDeltas(w, slot, o){
  if(!o.__dl){ const d = {}; for(const L of PG_LANES) d[L.id] = pgSlotScore(w, slot, o.id, L); o.__dl = d; }
  return o.__dl;
}
function pgCost(w, sel){
  let c = w.play.base.fixed || 0;
  for(const sl of w.play.slots){ const o = pgOpt(w, sl.k, sel[sl.k]); if(o) c += o.p || 0; }
  return c;
}
/* Exact optimiser. One choice per slot, one shared budget: the objective is additive per
   slot and the constraint is a single knapsack, so a per-slot DP over the remaining budget
   returns the true optimum — no greedy heuristic. Slot count is ~9 and the budget 100, so
   the table is tiny. */
function pgSolve(w, weights, norms, lossMul){
  const slots = w.play.slots;
  const B = Math.max(0, (w.play.base.budget || 100) - (w.play.base.fixed || 0));
  const NEG = -1e18, LM = lossMul || 1;
  const val = slots.map(sl=>sl.o.map(o=>{
    const d = pgDeltas(w, sl.k, o); let v = 0;
    /* a loss on a secondary axis is charged LM times a gain, which is what keeps a preset from
       paying for its strong axis with another one it does not care about */
    for(const L of PG_LANES){
      const wt = weights[L.id]; if(!wt) continue;
      const x = d[L.id];
      v += wt * (x < 0 ? x*LM : x) / (norms[L.id] || 1);
    }
    return v;
  }));
  let dp = new Array(B+1).fill(NEG); dp[0] = 0;
  const pickIdx = [], prevB = [];
  for(let i=0;i<slots.length;i++){
    const nd = new Array(B+1).fill(NEG), pi = new Int32Array(B+1).fill(-1), pv = new Int32Array(B+1).fill(-1);
    const opts = slots[i].o;
    for(let b=0;b<=B;b++){
      if(dp[b] === NEG) continue;
      for(let j=0;j<opts.length;j++){
        const nb = b + (opts[j].p || 0);
        if(nb > B) continue;
        const v = dp[b] + val[i][j];
        if(v > nd[nb] + 1e-12){ nd[nb] = v; pi[nb] = j; pv[nb] = b; }
      }
    }
    dp = nd; pickIdx.push(pi); prevB.push(pv);
  }
  let bb = 0; for(let b=1;b<=B;b++) if(dp[b] > dp[bb] + 1e-12) bb = b;
  const sel = Object.assign({}, w.play.def);
  if(dp[bb] === NEG){
    /* nothing fits the budget: fall back to the cheapest legal choice per slot */
    for(const sl of slots) sel[sl.k] = sl.o.slice().sort((a,b)=>(a.p||0)-(b.p||0))[0].id;
    return {sel, cost:pgCost(w, sel), score:NEG, over:pgCost(w, sel) > (w.play.base.budget||100)};
  }
  let b = bb;
  for(let i=slots.length-1;i>=0;i--){
    const j = pickIdx[i][b];
    if(j < 0) break;
    sel[slots[i].k] = slots[i].o[j].id;
    b = prevB[i][b];
  }
  return {sel, cost:pgCost(w, sel), score:dp[bb]};
}
/* reachable maximum of each axis on its own, inside the budget — the yardstick each axis is
   normalised against, and the number the fan's right edge and the matrix diagonal show */
function pgNorms(w){
  if(w.__pn) return w.__pn;
  const n = {};
  for(const L of PG_LANES){
    const r = pgSolve(w, {[L.id]:1}, {});          // unnormalised: weight 1, no norms needed
    n[L.id] = Math.max(0, pgLane(w, r.sel, L));
  }
  w.__pn = n; return n;
}
/* best build for one goal, honouring the point budget */
function pgBuild(w, lane){
  const norms = pgNorms(w);
  const wt = {}; for(const L of PG_LANES) wt[L.id] = 0;
  wt[lane.id] = 1;
  return pgSolve(w, wt, norms).sel;
}
/* widest swing per axis inside the budget: the fan of values the player can reach */
function pgEnv(w, lane){
  const norms = pgNorms(w);
  const up = pgSolve(w, {[lane.id]:1}, norms);
  const dn = pgSolve(w, {[lane.id]:-1}, norms);
  return {lo: pgLane(w, dn.sel, lane), hi: norms[lane.id]};
}
/* ---- recommended variants ---------------------------------------------------------------
   A preset must fill every slot it can afford, dominate its axis and still hold up elsewhere.
   One weighted objective cannot express "dominant but not lopsided", so the same solver is
   re-run over a few weight vectors — pure dominance, a guarded balance, and tilts toward the
   axes where the dominant build leaves the most on the table. Each result is a complete build
   inside the 100-point budget, and duplicates are dropped, so the list only shows real
   alternatives this weapon can actually reach. */
function pgAttain(w, sel, L, norms){
  const n = (norms || pgNorms(w))[L.id] || 1;
  return pgLane(w, sel, L) / n;
}
/* Weights are shares of one unit each, and the objective is scored on normalised attainment
   (0 = factory, 1 = that axis maxed inside the budget). Because there are eight secondary axes
   against one target, a per-lane weight would let the crowd outvote the goal — so the secondary
   side gets a fixed *total* share that is split evenly, keeping the goal ahead. Each variant also
   carries a floor: if the solver was willing to sink the goal, the weight is re-run stronger until
   the build actually dominates its axis. */
function pgVariants(w, target){
  const key = w.slug + '|' + target.id;
  if(!w.__pv) w.__pv = {};
  if(w.__pv[key]) return w.__pv[key];
  const norms = pgNorms(w);
  /* some weapons simply have no attachment that moves an axis (belt-fed LMGs have no reload
     part, several guns' barrels do not touch velocity). Nothing to offer, and saying so beats
     presenting a variant that changes nothing. */
  if(!(norms[target.id] > 1e-9)){
    const res = {list: [], norms, none: true};
    w.__pv[key] = res; return res;
  }
  const others = PG_LANES.filter(L => L.id !== target.id);
  const wtFor = (secondaryShare, tilt, tiltShare) => {
    const wt = {}; wt[target.id] = 1;
    const per = others.length ? secondaryShare / others.length : 0;
    for(const L of others) wt[L.id] = per;
    if(tilt) wt[tilt] = per + (tiltShare || 0);
    return wt;
  };
  const solve = (wt, floor, lm) => {
    let scale = 1, r = null;
    for(let i=0;i<7;i++){
      const wtt = Object.assign({}, wt); wtt[target.id] = scale;
      r = pgSolve(w, wtt, norms, lm);
      if(pgAttain(w, r.sel, target, norms) >= floor) break;
      scale *= 2;
    }
    return r;
  };
  const out = [];
  const add = (name, r) => {
    const sig = w.play.slots.map(s=>r.sel[s.k]).join('|');
    if(out.some(x=>x.sig === sig)) return;
    out.push({name, sig, sel:r.sel, cost:r.cost, att:pgAttain(w, r.sel, target, norms)});
  };
  const mk = (name, wt, floor, lm) => add(name, solve(wt, floor, lm));

  mk('Dominant', wtFor(0.15), 0.9, 1);
  mk('Balanced', wtFor(0.75), 0.6, 4);          // strong enough to refuse collateral damage
  /* tilts: after the dominant build, which axes still have the most headroom? those are the
     ones worth pairing the goal with, and each pairing moves different points around. */
  const dom = out[0];
  if(dom){
    const room = others.map(L=>({L, left: 1 - Math.max(0, pgAttain(w, dom.sel, L, norms))}))
                       .sort((a,b)=> b.left - a.left);
    for(const {L} of room.slice(0,4)) mk(target.label + ' + ' + L.label, wtFor(0.35, L.id, 0.35), 0.75, 2.5);
  }
  const res = {list: out.slice(0,4), norms};
  w.__pv[key] = res;
  return res;
}
/* field spec lookup, so a pill can be scored with the same function the lanes use */
const PG_FIELD = {};
for(const L of PG_LANES) for(const f of L.f) if(!PG_FIELD[f[0]]) PG_FIELD[f[0]] = f;

function pgPills(w, slotId, o){
  const fx = o.fx || {}, out = [];
  for(const k in PG_FX){                 /* declaration order keeps the pill row stable */
    if(fx[k] == null) continue;
    const lab = PG_FX[k][0];
    if(k==='adsInc' || k==='hipInc'){    /* absolute overrides carry no direction of their own */
      out.push(`<span class="nu">${fx[k]}° ${lab}</span>`);
      continue;
    }
    const spec = PG_FIELD[k];
    if(!spec) continue;
    const ref = pgRef(w, slotId);
    const sc = pgFScore(w, o, spec) - (ref ? pgFScore(w, ref, spec) : 0);
    if(Math.abs(sc) < 1e-9) continue;    /* identical to the factory part — nothing to report */
    let txt;
    if(PG_REF.has(k)){
      const v = pgVal(w, o, k), b = pgBase(w, k);
      if(k==='coll') txt = Math.round(v*100)+'%';
      else if(k==='dv') txt = (v>=b?'+':'−') + Math.round(Math.abs(v/b-1)*100) + '%';
      else txt = (v>b?'+':'−') + Math.abs(v-b);
    } else if(PG_MULT.has(k)) txt = (fx[k]>1?'+':'−') + Math.round(Math.abs(fx[k]-1)*100) + '%';
    else txt = (fx[k]>0?'+':'−') + Math.abs(fx[k]);
    out.push(`<span class="${sc>0?'up':'dn'}">${txt} ${lab}</span>`);
  }
  if(fx.pel) out.push(`<span class="nu">${fx.pel} pellets</span>`);
  if(fx.supp) out.push(`<span class="up">suppressed</span>`);
  if(fx.vis === 1) out.push(`<span class="dn">laser visible</span>`);
  else if(fx.vis === 0) out.push(`<span class="up">hidden</span>`);
  if(fx.regen) out.push(`<span class="up">regen +${fx.regen}s</span>`);
  if(fx.dur != null) out.push(`<span class="nu">recoil duration ${fx.dur}s</span>`);
  return out.length ? `<div class="sfx">${out.join('')}</div>` : '';
}
function pgAbs(w, sel){
  const b = w.play.base, BM = b.mult || {};
  /* the factory parts carry their own absolute multipliers, so the readout starts from the
     gun as it ships — a suppressed barrel shows 0% spotting, not a neutral 100% */
  let vel = BM.velMult != null ? BM.velMult : 1,
      rel = BM.reloadSpeedMult != null ? BM.reloadSpeedMult : 1,
      wsp = BM.worldSpotMult != null ? BM.worldSpotMult : 1,
      msp = BM.minimapSpotMult != null ? BM.minimapSpotMult : 1;
  let magd = 0, pel = b.pel, adsInc = b.adsInc, hipInc = b.hipInc, coll = b.coll;
  const tiers = {};
  for(const sl of w.play.slots){
    const o = pgOpt(w, sl.k, sel[sl.k]); if(!o) continue;
    const fx = o.fx || {};
    if(fx.velMult != null) vel *= fx.velMult;
    if(fx.reloadSpeedMult != null) rel *= fx.reloadSpeedMult;
    if(fx.worldSpotMult != null) wsp *= fx.worldSpotMult;
    if(fx.minimapSpotMult != null) msp *= fx.minimapSpotMult;
    if(fx.magd != null) magd += fx.magd;
    if(fx.pel != null) pel = fx.pel;
    if(fx.coll != null) coll = fx.coll;
    if(fx.adsInc != null) adsInc = fx.adsInc;
    if(fx.hipInc != null) hipInc = fx.hipInc;
    for(const k in fx) if(PG_TIERK.has(k)) tiers[k] = (tiers[k]||0) + fx[k];
  }
  const ammo = pgOpt(w,'ammo',sel.ammo);
  const dmg = pgDmg(w, ammo || {fx:{}});
  const btk = pgBtk(dmg);
  return {vel:Math.round(b.vel*vel), mag:b.mag + magd, pel, coll, tiers,
          empty:(b.empty!=null? b.empty/rel : null), tac:(b.tac!=null? b.tac/rel : null),
          wsp, msp, adsInc, hipInc,
          dmg:Math.round(dmg*10)/10, btk, ttk:(btk-1)*CYCLE_MS(w)};
}
function pgTierLine(tiers){
  const keys = Object.keys(tiers).filter(k=>tiers[k]);
  if(!keys.length) return 'no tier changes';
  return keys.sort((a,b)=>Math.abs(tiers[b])-Math.abs(tiers[a]))
    .slice(0,7).map(k=>{
      const v = tiers[k], lab = (PG_FX[k]||[k])[0], dir = (PG_FX[k]||[k,1])[1];
      return `<span style="color:${v*dir>0?'#6fd48a':'#e0707a'}">${lab} ${v>0?'+':'−'}${Math.abs(v)}</span>`;
    }).join(' · ');
}

/* the command bar is sticky at top:0 and changes height across breakpoints, so the goal bar's
   offset is measured from it rather than hard-coded. */
function syncBarh(){
  const b = document.querySelector('#viewPlay .wbar');
  if(b) document.documentElement.style.setProperty('--wbarh', b.offsetHeight + 'px');
}
window.addEventListener('resize', syncBarh);

function renderPlay(w, keepScroll){
  curW = null;
  document.body.classList.add('wpn');
  document.getElementById('viewCatalog').hidden = true;
  document.getElementById('viewWeapon').hidden = true;
  const vp = document.getElementById('viewPlay'); vp.hidden = false;
  setBackdrop(w.img || '');
  if(playState.slug !== w.slug){
    playState.slug = w.slug;
    playState.sel = Object.assign({}, w.play.def);
    playState.slot = w.play.slots[0].k;
  }
  for(const sl of w.play.slots)
    if(!sl.o.some(o=>o.id===playState.sel[sl.k])) playState.sel[sl.k] = w.play.def[sl.k] || sl.o[0].id;
  if(!w.play.slots.some(s=>s.k===playState.slot)) playState.slot = w.play.slots[0].k;

  const sel = playState.sel;
  const V = pgVariants(w, PG_LANES.find(l=>l.id===playState.goal) || PG_LANES[0]);
  const avail = PG_LANES.filter(l => (V.norms[l.id] || 0) > 1e-9);
  const goal = PG_LANES.find(l => l.id===playState.goal && avail.includes(l)) || avail[0] || PG_LANES[0];
  playState.goal = goal.id;
  const rows = PG_LANES.map(lane=>{
    const cur = pgLane(w, sel, lane), env = pgEnv(w, lane);
    /* share of the reachable upside this build has actually taken, measured against what the
       point budget actually allows: 0 = factory gun, 1 = nothing left on the table */
    const pct = env.hi > 0 ? Math.max(0, Math.min(1, cur/env.hi)) : 0;
    return {lane, cur, env, pct, ok: (V.norms[lane.id]||0) > 1e-9};
  });
  /* the potential average only counts axes this weapon can actually move */
  const scored = rows.filter(r=>r.ok);
  const pot = scored.length ? Math.round(100 * scored.reduce((a,r)=>a+r.pct,0) / scored.length) : 0;
  const cost = pgCost(w, sel), budget = w.play.base.budget || 100;
  const over = cost > budget;
  const A = pgAbs(w, sel);
  const sig = w.play.slots.map(s=>sel[s.k]).join('|');
  const activeV = V.list.find(x=>x.sig === sig);
  const changed = w.play.slots.filter(s=>sel[s.k] !== w.play.def[s.k]).length;

  document.getElementById('phead').innerHTML = `
    <div class="wthumb"><img src="${w.img||''}" alt="${esc(w.name)}" decoding="async"></div>
    <div class="wtt">
      <div class="wkick"><span class="cls">${w.clsLabel}</span><span class="wsub">${esc(weaponTagline(w))}</span></div>
      <h2>${esc(w.name)}</h2>
      <div class="wreal">${esc(w.ammo)} · banco de armado</div>
    </div>`;
  document.getElementById('pstats').innerHTML = [
    ['Vel', A.vel, 'm/s', true],
    ['Mag', A.mag, 'rds', false],
    ['Dmg '+state.dist+'m', A.dmg, '', true],
    ['BTK', A.btk, ''],
    ['TTK', A.btk<=1?'1-shot':Math.round(A.ttk), A.btk<=1?'':'ms', true],
  ].map(([k,v,u,hl])=>`<div class="wst ${hl?'hl':''}"><span class="k">${k}</span><span class="v">${v}${u?`<small>${u}</small>`:''}</span></div>`).join('');

  const slot = w.play.slots.find(s=>s.k===playState.slot) || w.play.slots[0];
  const opts = slot.o.slice().sort((a,b)=> b.p-a.p || a.n.localeCompare(b.n));

  /* one shared scale for every fan band, so the grey bars are comparable across axes */
  const gLo = Math.min(0, ...rows.map(r=>r.env.lo));
  const gHi = Math.max(0, ...rows.map(r=>r.env.hi));
  const gSpan = (gHi - gLo) || 1;
  const xOf = v => (v - gLo)/gSpan*100;

  document.getElementById('pgbar').innerHTML = `
    <span class="pglb">Optimise for</span>
    <div class="pggoals" id="pggoals">
      ${PG_LANES.map(l=>{
        const ok = avail.includes(l);
        return `<button class="pgchip ${l.id===goal.id?'on':''} ${ok?'':'off'}" data-goal="${l.id}" ${ok?'':'disabled title="No attachment on this weapon moves this axis"'}>${l.label}</button>`;
      }).join('')}
      <button class="pgchip" data-goal="__reset">Reset</button>
    </div>
    <span class="sp"></span>
    <span class="pgsum"><b class="${over?'ov':''}">${cost}</b>/${budget} pts · <b>${pot}%</b> potential · <b>${changed}</b>/${w.play.slots.length} slots</span>`;

  document.getElementById('pbody').innerHTML = `
  <div class="kpanel pgrec">
    <h4>Recommended builds — ${goal.label} <span class="pghint">every slot spent inside ${budget} pts</span></h4>
    <div class="pgvars">
      ${!V.list.length ? `<div class="none" style="grid-column:1/-1;padding:20px 0">No attachment on the ${esc(w.name)} moves <b>${goal.label}</b>, so there is nothing to optimise here — pick another axis.</div>`
      : V.list.map((v,i)=>{
        const lanes = PG_LANES.map(L=>({L, v:pgLane(w, v.sel, L)})).filter(x=>Math.abs(x.v) > 0.05)
          .sort((a,b)=> Math.abs(b.v) - Math.abs(a.v)).slice(0,4);
        const chg = w.play.slots.filter(s=>v.sel[s.k] !== w.play.def[s.k]);
        return `<div class="pgvar ${activeV===v?'on':''}" data-sig="${v.sig}">
          <div class="vh"><span class="vn">${esc(v.name)}</span>
            <span class="vc ${v.cost>budget?'ov':''}">${v.cost}/${budget} pt</span></div>
          <div class="vatt">${goal.label} <b>${Math.round(Math.max(0,v.att)*100)}%</b> of reachable</div>
          <div class="vlanes">${lanes.map(x=>`<span class="${x.v>0?'up':'dn'}">${x.v>0?'+':'−'}${Math.abs(x.v).toFixed(1)} ${x.L.label}</span>`).join('')}</div>
          <div class="vslots">${chg.map(s=>{
            const o = pgOpt(w, s.k, v.sel[s.k]);
            return `<span class="vs">${esc(s.l)} <b>${esc(o?o.n:'—')}</b></span>`;
          }).join('') || '<span class="vs">factory configuration</span>'}</div>
          <span class="vuse">${activeV===v?'in use':'use this build'}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="note">Each column is a complete loadout the solver found inside the budget: <b>Dominant</b> pushes the goal as far as the points allow, <b>Balanced</b> keeps the goal ahead but refuses to wreck the rest, and the pairings tilt toward the axes the dominant build left open. All of them respect ${budget} points and every slot the weapon can take.</div>
  </div>
  <div class="pghero">
    <div class="note" style="margin:0">Every slot offers a real variation of the weapon. Pills use the datamined magnitude of the attachment: <b>the sign is the change in the stat, the colour says whether it plays for you (green) or against you (red)</b>. Each axis <b>index</b> is additive and unitless, and starts at 0 for the gun exactly as it ships — positive is always an improvement.</div>
    <div class="pgpot">
      <div class="dial"><svg viewBox="0 0 100 100">
        <circle class="trk" cx="50" cy="50" r="40"/>
        <circle class="arc" cx="50" cy="50" r="40" style="stroke-dasharray:${(2*Math.PI*40).toFixed(1)};stroke-dashoffset:${(2*Math.PI*40*(1-pot/100)).toFixed(1)}"/></svg>
        <div class="mid"><div class="big">${pot}%</div><div class="cap">potential</div></div></div>
      <div class="side">
        <b>${changed}</b> slot${changed===1?'':'s'} changed · <b>${w.play.slots.length}</b> available<br>
        Velocity <b>${A.vel} m/s</b> · Magazine <b>${A.mag}</b><br>
        Reload <b>${A.empty!=null? A.empty.toFixed(2)+' s':'—'}</b><br>
        Visibility <b>${Math.round(A.wsp*100)}% / ${Math.round(A.msp*100)}%</b> <span style="color:var(--dim2)">world / minimap · lower is better</span>
      </div>
    </div>
  </div>

  <div class="pggrid">
    <div>
      <div class="kpanel" style="margin-bottom:16px">
        <h4>Slot &amp; attachments</h4>
        <div class="pgslots" id="pgslots">
          ${w.play.slots.map(s=>`<button class="attslot ${s.k===slot.k?'on':''}" data-slot="${s.k}">${GLYPH[s.l]?`<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPH[s.l]}</svg>`:''}<span>${s.l}</span><span class="n">${s.o.length}</span></button>`).join('')}
        </div>
        <div class="pgopts" id="pgopts">
          ${opts.map(o=>`<button class="pgopt ${sel[slot.k]===o.id?'on':''}" data-id="${o.id}">${attIcon(slot.l, o.ic)}
            <div class="txt"><div class="nm">${esc(o.n)}${o.p?`<em>${o.p} pt</em>`:''}</div>
            ${o.t>=0?`<div style="font-size:10.5px;line-height:1.4;color:var(--dim2);margin-top:3px">${esc(TIPS[o.t]||'')}</div>`:''}
            ${pgPills(w, slot.k, o)}</div></button>`).join('')}
        </div>
      </div>

      <div class="kpanel" style="margin-bottom:16px">
        <h4>Current build</h4>
        <div class="pgbud ${over?'ov':''}">
          <span>Pick-100 budget</span>
          <span class="pgbudbar"><i style="width:${Math.min(100, cost/budget*100).toFixed(0)}%"></i></span>
          <b>${cost} / ${budget} pt</b>
          <span class="pgbudrest">${over? 'over budget' : (budget-cost)+' pt free · '+w.play.base.fixed+' pt locked in factory parts'}</span>
        </div>
        <div class="pgbuild">
          ${w.play.slots.map(s=>{
            const o = pgOpt(w, s.k, sel[s.k]);
            const d = sel[s.k] !== w.play.def[s.k];
            return `<div class="pgb" style="${d?'border-color:#4a3a18':''}">${attIcon(s.l, o?o.ic:-1)}
              <div><span class="sl">${s.l}</span><span class="nm" style="${d?'color:var(--accent)':''}">${esc(o?o.n:'—')}</span></div></div>`;
          }).join('')}
        </div>
        <div class="note">Amber = changed from the factory gun.</div>
      </div>

      <div class="kpanel">
        <h4>Absolute readout — this build</h4>
        <table class="spec">
          <tr><td>Muzzle velocity</td><td>${A.vel} m/s</td></tr>
          <tr><td>Damage per shot @ ${state.dist} m</td><td>${A.dmg} (${A.btk<=1?'1 shot':A.btk+' hits'})</td></tr>
          <tr><td>Pellets per shot</td><td>${A.pel}</td></tr>
          <tr><td>Magazine</td><td>${A.mag} rounds</td></tr>
          <tr><td>Reload from empty</td><td>${A.empty!=null? A.empty.toFixed(2)+' s':'—'}</td></tr>
          <tr><td>ADS spread growth</td><td>${A.adsInc!=null? A.adsInc+'°/shot':'—'}</td></tr>
          <tr><td>Hip spread growth</td><td>${A.hipInc!=null? A.hipInc+'°/shot':'—'}</td></tr>
          <tr><td>Collateral multiplier</td><td>${A.coll!=null? Math.round(A.coll*100)+'%':'—'}</td></tr>
          <tr><td>Visibility — world / minimap</td><td>${Math.round(A.wsp*100)}% / ${Math.round(A.msp*100)}%</td></tr>
        </table>
        <div class="note">Accumulated tiers: ${pgTierLine(A.tiers)}</div>
      </div>
    </div>

    <div>
      <div class="kpanel" style="margin-bottom:16px">
        <h4>Fan — reachable value per axis</h4>
        <div id="pglanes">
          ${rows.map(r=>`<div class="pglane ${r.lane.id===goal.id?'sel':''}">
            <span class="n">${r.lane.label}</span>
            <span class="pgenv">
              ${r.env.hi>r.env.lo?`<i class="rng" style="left:${xOf(r.env.lo).toFixed(2)}%;width:${(xOf(r.env.hi)-xOf(r.env.lo)).toFixed(2)}%"></i>`:''}
              <i class="zero" style="left:${xOf(0).toFixed(2)}%"></i>
              ${r.lane.id===goal.id?`<i class="cur" style="left:${xOf(r.cur).toFixed(2)}%"></i>`:''}
            </span>
            <span class="v">${(r.cur>0?'+':'')+r.cur.toFixed(1)}<small>/${(r.env.hi>0?'+':'')+r.env.hi.toFixed(1)}</small></span>
          </div>`).join('')}
        </div>
        <div class="note">The grey band is everything reachable on that axis for the ${budget} points the weapon has, with every slot filled as far as the budget allows; <b>every band shares one scale</b>, so the widest band is the axis with the most headroom. The thin vertical mark is zero (factory gun) and the amber marker is your build on the axis you are optimising. Index 1.0 ≈ one tier level or a 100% multiplier; magazine rounds score at 15%.</div>
      </div>

      <div class="kpanel">
        <h4>Trade-off matrix — what each goal costs you</h4>
        <div class="pgmxwrap"><div class="pgmx" style="grid-template-columns:74px repeat(${PG_LANES.length},minmax(0,1fr))">
          <i class="h"></i>${PG_LANES.map(l=>`<i class="h">${l.label}</i>`).join('')}
          ${PG_LANES.map(row=>{
            const b = pgBuild(w, row);
            return `<i class="rh">${row.label}</i>` + PG_LANES.map(col=>{
              const v = pgLane(w, b, col);
              const cls = v > 0.05 ? 'up' : v < -0.05 ? 'dn' : 'z';
              return `<i class="${cls}" ${col.id===row.id?'style="background:#2a2415"':''}>${(v>0?'+':'')+v.toFixed(1)}</i>`;
            }).join('');
          }).join('')}
        </div></div>
        <div class="note">Each row is the best possible build for that goal inside the ${budget}-point budget, and each cell is how the rest of the weapon ends up with it. The diagonal is the maximum reachable per axis. Because every effect is additive per slot and there is one shared budget, the solver is an exact knapsack — there is no hidden better combination. A row of zeroes is an axis no attachment on this weapon moves.</div>
      </div>
    </div>
  </div>`;

  // ---- events ----
  document.getElementById('pggoals').querySelectorAll('.pgchip').forEach(b=>b.onclick=()=>{
    const g = b.dataset.goal;
    if(g==='__reset'){ playState.sel = Object.assign({}, w.play.def); }
    else {
      playState.goal = g;
      const lane = PG_LANES.find(l=>l.id===g);
      playState.sel = pgVariants(w, lane).list[0].sel;   // dominant build for the new goal
    }
    renderPlay(w, true);
  });
  document.getElementById('pbody').querySelectorAll('.pgvar').forEach(el=>el.onclick=()=>{
    const v = V.list.find(x=>x.sig===el.dataset.sig);
    if(v){ playState.sel = Object.assign({}, v.sel); renderPlay(w, true); }
  });
  document.getElementById('pgslots').querySelectorAll('.attslot').forEach(b=>b.onclick=()=>{
    playState.slot = b.dataset.slot; renderPlay(w, true);
  });
  document.getElementById('pgopts').querySelectorAll('.pgopt').forEach(b=>b.onclick=()=>{
    playState.sel[slot.k] = b.dataset.id; renderPlay(w, true);
  });
  syncBarh();
  if(!keepScroll) window.scrollTo(0,0);
}

/* ---- controls ---- */
function syncRange(){
  const cd = document.getElementById('dist'); if(cd) cd.value = state.dist;
  document.getElementById('distv').textContent = state.dist+'m';
  const wd = document.getElementById('wdist'); if(wd) wd.value = state.dist;
  const wv = document.getElementById('wdistv'); if(wv) wv.textContent = state.dist+'m';
  const pd = document.getElementById('pdist'); if(pd) pd.value = state.dist;
  const pv = document.getElementById('pdistv'); if(pv) pv.textContent = state.dist+'m';
}
function setDist(v){
  state.dist = +v;
  syncRange();
  if(!document.getElementById('viewPlay').hidden && playState.slug){
    const pw = WEAPONS.find(x=>x.slug===playState.slug);
    if(pw){ renderPlay(pw, true); return; }
  }
  if(curW && !document.getElementById('viewWeapon').hidden) renderWeapon(curW, true);
  else renderGrid();
}
document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; renderGrid(); });
document.getElementById('sort').addEventListener('change', e=>{ state.sort=e.target.value; renderGrid(); });
document.getElementById('dist').addEventListener('input', e=>setDist(e.target.value));
document.getElementById('wdist').addEventListener('input', e=>setDist(e.target.value));
document.getElementById('pdist').addEventListener('input', e=>setDist(e.target.value));
document.getElementById('only').addEventListener('click', e=>{
  state.only = !state.only;
  const b = e.currentTarget;
  b.classList.toggle('on', state.only);
  b.setAttribute('aria-pressed', String(state.only));
  renderGrid();
});
document.getElementById('back').addEventListener('click', ()=>{ location.hash=''; });
document.getElementById('pgopen').addEventListener('click', ()=>{ if(curW) goPlay(curW.slug); });
document.getElementById('pback').addEventListener('click', ()=>{ if(playState.slug) go(playState.slug); });

document.getElementById('foot').innerHTML =
  `<b>Sources.</b> Weapon renders: in-game armory screenshots (BF6 Balance Log), Battlefield Wiki / Fandom as fallback. `+
  `Base stats (damage, velocity, ROF, spread, reload): sym.gg BF6 game-file dump ${VER}. `+
  `Descriptions, fire modes, attachment lists and in-game attachment text: community datamine <i>BF6-Weapon-Analyzer</i> (no license — attributed). `+
  `Meta tiers, real-world firearm references and map intel: public community sources.<br>`+
  `Self-contained, offline, no network requests. Fan-made reference — not affiliated with EA/DICE. `+
  `TTK model: 100 HP, chest shots, constant damage per range band. `+
  `The playground applies the datamined per-attachment fields on top of the bare weapon and fits every build inside the game's 100-point Pick-100 budget; tier axes keep the game's own ladder because the tier→number table is not public. `+
  `Map fit is a derived heuristic, not a guarantee.`;

renderChips();
renderGrid();
route();
</script>
</body>
</html>
